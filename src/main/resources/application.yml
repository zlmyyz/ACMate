server:
  port: 8080
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 1h
      cookie:
        http-only: true
        same-site: lax
        max-age: 1h

spring:
  application:
    name: acmate

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
      database: 3
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:true}
      mail.smtp.ssl.enable: ${MAIL_SSL:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:acmate}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never

  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

  global-config:
    db-config:
      id-type: auto

acmate:
  trusted-proxies: ${TRUSTED_PROXY_IPS:}
  login:
    email-enabled: ${LOGIN_EMAIL_ENABLED:false}
    mail-from: ${MAIL_FROM:}
    github-enabled: ${LOGIN_GITHUB_ENABLED:false}
    github-client-id: ${GITHUB_CLIENT_ID:}
    github-client-secret: ${GITHUB_CLIENT_SECRET:}
    github-callback-url: ${GITHUB_CALLBACK_URL:}
  codeforces:
    scheduling:
      enabled: true
      cron: "0 0 * * * *"
      zone: "Asia/Shanghai"
